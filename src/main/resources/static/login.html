<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todolist可视化网页</title>
</head>
<body>
    <h1>todolist可视化网页</h1>
    <div class = "box" id="register_login">
        <h3>注册/登录</h3>
        <input type="text" id="username" name="username" placeholder="用户名" required><br><br>
        <input type="password" id="password" name="password" placeholder="密码" required><br><br>
        <button onclick="register()">注册</button>
        <button onclick="login()">登录</button>
    </div>
</body>

<script>
    window.onload = function(){
        fetch(`/api/todo/list`)
        .then(response => response.json())
        .then(data=>{
            if(Array.isArray(data)){
                document.getElementById('register_login').style.display = 'none';
            }
        }).catch(e => console.log("未登录"));
    }


    function register(){
        let username = document.getElementById('username').value;
        let password = document.getElementById('password').value;
        fetch(`/api/register?username=${username}&password=${password}`)
        .then(response => response.text())
        .then(data => alert(data));
    }

    function login(){
        let username = document.getElementById('username').value;
        let password = document.getElementById('password').value;

        // 1. 修改路径：通常是 /api/user/login
        // 2. 用 .text() 接收文字
        fetch(`/api/login?username=${username}&password=${password}`)
            .then(response => response.text())
            .then(data => {
                alert(data); // 先弹窗看看后端说了啥

                // 3. 核心：判断是不是真的成功了才跳转
                if (data.includes("成功")) {
                    window.location.href = "/todolist.html"; // 成功才进主页
                }
                // 如果失败（包含 msg 或 错误），就不跳转，留在当前页面
            })
            .catch(error => {
                alert("网络请求失败，请检查后端是否启动！");
            });
    }

</script>

</html>
